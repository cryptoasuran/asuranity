<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ASURANITY Features Demo</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
      color: #f1f5f9;
      padding: 20px;
    }

    .container {
      max-width: 1400px;
      margin: 0 auto;
    }

    h1 {
      text-align: center;
      margin-bottom: 40px;
      background: linear-gradient(135deg, #6366f1, #8b5cf6, #ec4899);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      font-size: 3rem;
    }

    .demo-section {
      background: rgba(30, 41, 59, 0.7);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(148, 163, 184, 0.1);
      border-radius: 16px;
      padding: 30px;
      margin-bottom: 30px;
    }

    .demo-section h2 {
      margin-bottom: 20px;
      color: #6366f1;
    }

    button {
      background: linear-gradient(135deg, #6366f1, #8b5cf6);
      color: white;
      border: none;
      padding: 12px 24px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 16px;
      margin: 5px;
      transition: transform 0.2s;
    }

    button:hover {
      transform: scale(1.05);
    }

    button:active {
      transform: scale(0.95);
    }

    input, select {
      background: #1e293b;
      border: 1px solid #334155;
      color: #f1f5f9;
      padding: 10px;
      border-radius: 8px;
      margin: 5px;
      font-size: 14px;
    }

    canvas {
      border: 2px solid #334155;
      border-radius: 8px;
      max-width: 100%;
    }

    .output {
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 8px;
      padding: 15px;
      margin-top: 15px;
      font-family: 'Courier New', monospace;
      font-size: 14px;
      max-height: 400px;
      overflow-y: auto;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 20px;
      margin-top: 20px;
    }

    .stat {
      background: #1e293b;
      padding: 15px;
      border-radius: 8px;
      border: 1px solid #334155;
    }

    .stat-label {
      color: #94a3b8;
      font-size: 12px;
      margin-bottom: 5px;
    }

    .stat-value {
      color: #6366f1;
      font-size: 24px;
      font-weight: bold;
    }

    .success {
      color: #10b981;
    }

    .error {
      color: #ef4444;
    }

    .warning {
      color: #f59e0b;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🚀 ASURANITY Features Demo</h1>

    <!-- AI Pattern Suggester Demo -->
    <div class="demo-section">
      <h2>🤖 AI Pattern Suggester</h2>
      <div>
        <label>Pattern Length:</label>
        <input type="number" id="patternLength" value="4" min="1" max="8">

        <label>Difficulty:</label>
        <select id="difficulty">
          <option value="easy">Easy</option>
          <option value="medium" selected>Medium</option>
          <option value="hard">Hard</option>
          <option value="extreme">Extreme</option>
        </select>

        <label>Theme:</label>
        <select id="theme">
          <option value="">None</option>
          <option value="crypto">Crypto</option>
          <option value="lucky">Lucky</option>
          <option value="cool">Cool</option>
          <option value="nature">Nature</option>
          <option value="tech">Tech</option>
        </select>

        <button onclick="testAISuggester()">Get Suggestions</button>
      </div>
      <div id="aiOutput" class="output"></div>
    </div>

    <!-- Pattern Difficulty Visualizer Demo -->
    <div class="demo-section">
      <h2>📊 Pattern Difficulty Visualizer</h2>
      <div>
        <label>Pattern:</label>
        <input type="text" id="vizPattern" value="abc" placeholder="Enter pattern">

        <label>Type:</label>
        <select id="vizType">
          <option value="prefix">Prefix</option>
          <option value="suffix">Suffix</option>
          <option value="contains">Contains</option>
        </select>

        <button onclick="testVisualizer()">Visualize</button>
      </div>
      <canvas id="vizCanvas" width="800" height="600"></canvas>
      <div id="vizOutput" class="output"></div>
    </div>

    <!-- GPU Benchmark Demo -->
    <div class="demo-section">
      <h2>⚡ GPU Benchmark Suite</h2>
      <button onclick="testGPUBenchmark()">Run Full Benchmark</button>
      <button onclick="testCPUOnly()">CPU Only</button>
      <div id="benchmarkOutput" class="output"></div>
      <div id="benchmarkStats" class="grid"></div>
    </div>

    <!-- Address Art Generator Demo -->
    <div class="demo-section">
      <h2>🎨 Address Art Generator</h2>
      <div>
        <label>Address:</label>
        <input type="text" id="artAddress" value="0x742d35Cc6634C0532925a3b844Bc9e7595f0bEb" style="width: 400px">

        <label>Style:</label>
        <select id="artStyle">
          <option value="geometric">Geometric</option>
          <option value="organic">Organic</option>
          <option value="pixel">Pixel</option>
          <option value="abstract">Abstract</option>
          <option value="mandala">Mandala</option>
          <option value="wave">Wave</option>
          <option value="spiral">Spiral</option>
          <option value="fractal">Fractal</option>
        </select>

        <button onclick="testArtGenerator()">Generate Art</button>
        <button onclick="testAllStyles()">Generate All Styles</button>
      </div>
      <canvas id="artCanvas" width="600" height="600"></canvas>
    </div>

    <!-- Social Sharing Demo -->
    <div class="demo-section">
      <h2>📱 Social Sharing</h2>
      <div>
        <label>Template:</label>
        <select id="shareTemplate">
          <option value="simple">Simple</option>
          <option value="detailed">Detailed</option>
          <option value="competitive">Competitive</option>
          <option value="artistic">Artistic</option>
        </select>

        <button onclick="testSocialSharing()">Generate Message</button>
        <button onclick="testShareImage()">Generate Share Image</button>
      </div>
      <div id="shareOutput" class="output"></div>
      <canvas id="shareCanvas" width="1200" height="630" style="display:none"></canvas>
    </div>

    <!-- Core Engine Test -->
    <div class="demo-section">
      <h2>🔧 Core Engine Test</h2>
      <div>
        <label>Pattern:</label>
        <input type="text" id="enginePattern" value="abc" placeholder="Enter pattern">

        <label>Iterations:</label>
        <input type="number" id="engineIterations" value="1000" min="100" max="100000">

        <button onclick="testCoreEngine()">Test Generation</button>
      </div>
      <div id="engineOutput" class="output"></div>
    </div>
  </div>

  <script type="module">
    import { AIPatternSuggester } from './src/features/AIPatternSuggester.js';
    import { PatternDifficultyVisualizer } from './src/features/PatternDifficultyVisualizer.js';
    import { GPUBenchmarkSuite } from './src/features/GPUBenchmarkSuite.js';
    import { AddressArtGenerator } from './src/features/AddressArtGenerator.js';
    import { SocialSharing } from './src/features/SocialSharing.js';
    import { PatternMatcher } from './src/core/PatternMatcher.js';

    window.aiSuggester = new AIPatternSuggester();
    window.visualizer = new PatternDifficultyVisualizer(document.getElementById('vizCanvas'));
    window.benchmark = new GPUBenchmarkSuite();
    window.artGenerator = new AddressArtGenerator(document.getElementById('artCanvas'));
    window.socialSharing = new SocialSharing();

    window.testAISuggester = async function() {
      const length = parseInt(document.getElementById('patternLength').value);
      const difficulty = document.getElementById('difficulty').value;
      const theme = document.getElementById('theme').value || null;

      const output = document.getElementById('aiOutput');
      output.innerHTML = '<div class="warning">Generating suggestions...</div>';

      try {
        const suggestions = await window.aiSuggester.suggestPatterns({
          length,
          difficulty,
          theme
        });

        let html = '<div class="success">✓ Generated ' + suggestions.length + ' suggestions:</div><br>';

        suggestions.forEach((s, i) => {
          html += `<div style="margin-bottom: 15px; padding: 10px; background: #1e293b; border-radius: 8px;">
            <strong>${i + 1}. ${s.pattern}</strong> (Score: ${s.score.toFixed(1)})<br>
            Difficulty: ${s.difficulty.toExponential(2)}<br>
            Est. Time: ${formatTime(s.estimatedTime)}<br>
            ${s.recommendation}
          </div>`;
        });

        output.innerHTML = html;
      } catch (error) {
        output.innerHTML = '<div class="error">Error: ' + error.message + '</div>';
      }
    };

    window.testVisualizer = async function() {
      const pattern = document.getElementById('vizPattern').value;
      const type = document.getElementById('vizType').value;

      const output = document.getElementById('vizOutput');
      output.innerHTML = '<div class="warning">Generating visualization...</div>';

      try {
        await window.visualizer.visualize(pattern, type);
        output.innerHTML = '<div class="success">✓ Visualization complete! (Interactive - drag to rotate, scroll to zoom)</div>';
      } catch (error) {
        output.innerHTML = '<div class="error">Error: ' + error.message + '</div>';
      }
    };

    window.testGPUBenchmark = async function() {
      const output = document.getElementById('benchmarkOutput');
      const stats = document.getElementById('benchmarkStats');

      output.innerHTML = '<div class="warning">Running full benchmark... This may take a minute.</div>';
      stats.innerHTML = '';

      try {
        const results = await window.benchmark.runFullBenchmark();

        output.innerHTML = '<div class="success">✓ Benchmark complete!</div>';

        let statsHTML = '';

        if (results.cpu) {
          statsHTML += `<div class="stat">
            <div class="stat-label">CPU Score</div>
            <div class="stat-value">${results.cpu.score}</div>
          </div>`;
        }

        if (results.webgl) {
          statsHTML += `<div class="stat">
            <div class="stat-label">WebGL Score</div>
            <div class="stat-value">${results.webgl.score}</div>
          </div>`;
        }

        if (results.webgpu) {
          statsHTML += `<div class="stat">
            <div class="stat-label">WebGPU Score</div>
            <div class="stat-value">${results.webgpu.score}</div>
          </div>`;
        }

        if (results.comparison) {
          statsHTML += `<div class="stat">
            <div class="stat-label">Recommended</div>
            <div class="stat-value">${results.comparison.recommendation}</div>
          </div>`;
        }

        stats.innerHTML = statsHTML;
      } catch (error) {
        output.innerHTML = '<div class="error">Error: ' + error.message + '</div>';
      }
    };

    window.testCPUOnly = async function() {
      const output = document.getElementById('benchmarkOutput');
      output.innerHTML = '<div class="warning">Running CPU benchmark...</div>';

      try {
        const result = await window.benchmark.benchmarkCPU();
        output.innerHTML = `<div class="success">✓ CPU Benchmark complete!</div>
          <br>Score: ${result.score}
          <br>Hash Rate: ${result.hashRate.hashRate.toFixed(0)} H/s`;
      } catch (error) {
        output.innerHTML = '<div class="error">Error: ' + error.message + '</div>';
      }
    };

    window.testArtGenerator = async function() {
      const address = document.getElementById('artAddress').value;
      const style = document.getElementById('artStyle').value;

      try {
        await window.artGenerator.generate(address, style);
      } catch (error) {
        alert('Error: ' + error.message);
      }
    };

    window.testAllStyles = async function() {
      const address = document.getElementById('artAddress').value;
      alert('Generating all 8 styles... Check console for results');

      try {
        const results = await window.artGenerator.generateAll(address);
        console.log('Generated art for all styles:', results);
      } catch (error) {
        alert('Error: ' + error.message);
      }
    };

    window.testSocialSharing = async function() {
      const template = document.getElementById('shareTemplate').value;
      const output = document.getElementById('shareOutput');

      const mockResult = {
        address: '0x742d35Cc6634C0532925a3b844Bc9e7595f0bEb',
        pattern: 'abc',
        patternType: 'prefix',
        network: 'ethereum'
      };

      const mockStats = {
        elapsedTime: 125.5,
        totalChecked: 1500000,
        hashRate: 11952
      };

      try {
        const message = await window.socialSharing.generateMessage(mockResult, template, { stats: mockStats });
        output.innerHTML = '<div class="success">✓ Message generated:</div><br><pre>' + message + '</pre>';
      } catch (error) {
        output.innerHTML = '<div class="error">Error: ' + error.message + '</div>';
      }
    };

    window.testShareImage = async function() {
      const mockResult = {
        address: '0x742d35Cc6634C0532925a3b844Bc9e7595f0bEb',
        pattern: 'abc',
        network: 'ethereum'
      };

      const mockStats = {
        elapsedTime: 125.5,
        hashRate: 11952
      };

      try {
        const dataUrl = await window.socialSharing.generateShareImage(mockResult, { stats: mockStats });
        const output = document.getElementById('shareOutput');
        output.innerHTML = '<div class="success">✓ Share image generated!</div><br><img src="' + dataUrl + '" style="max-width: 100%; border-radius: 8px;">';
      } catch (error) {
        alert('Error: ' + error.message);
      }
    };

    window.testCoreEngine = function() {
      const pattern = document.getElementById('enginePattern').value;
      const iterations = parseInt(document.getElementById('engineIterations').value);
      const output = document.getElementById('engineOutput');

      output.innerHTML = '<div class="warning">Testing pattern matching...</div>';

      try {
        const matcher = new PatternMatcher(pattern, { type: 'prefix' });
        let matches = 0;
        const startTime = performance.now();

        for (let i = 0; i < iterations; i++) {
          const testAddr = '0x' + Math.random().toString(16).substring(2, 42);
          if (matcher.test(testAddr)) {
            matches++;
          }
        }

        const endTime = performance.now();
        const duration = endTime - startTime;

        output.innerHTML = `<div class="success">✓ Test complete!</div>
          <br>Iterations: ${iterations.toLocaleString()}
          <br>Matches: ${matches}
          <br>Duration: ${duration.toFixed(2)}ms
          <br>Rate: ${(iterations / (duration / 1000)).toFixed(0)} checks/sec
          <br>Difficulty: ${matcher.getDifficulty().toExponential(2)}`;
      } catch (error) {
        output.innerHTML = '<div class="error">Error: ' + error.message + '</div>';
      }
    };

    function formatTime(seconds) {
      if (seconds < 60) return seconds.toFixed(1) + 's';
      if (seconds < 3600) return (seconds / 60).toFixed(1) + 'm';
      if (seconds < 86400) return (seconds / 3600).toFixed(1) + 'h';
      return (seconds / 86400).toFixed(1) + 'd';
    }

    console.log('✓ ASURANITY Features Demo loaded');
    console.log('All features initialized and ready to test');
  </script>
</body>
</html>
